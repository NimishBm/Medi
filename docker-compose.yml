version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: clinicflow-db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: clinicflow
    volumes:
      - mongo_data:/data/db
    networks:
      - clinicflow-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clinicflow-api
    ports:
      - '5000:5000'
    environment:
      MONGO_URI: mongodb://admin:password123@mongodb:27017/clinicflow?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - clinicflow-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clinicflow-ui
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - server
    networks:
      - clinicflow-network

volumes:
  mongo_data:

networks:
  clinicflow-network:
    driver: bridge
